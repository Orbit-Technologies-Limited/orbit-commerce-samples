name: Starters

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared:
    name: Shared files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Every starter carries the same shared files
        run: node scripts/sync-shared.mjs --check
      - name: The sync script's tests
        run: node --test scripts/*.test.mjs

  starter:
    name: ${{ matrix.starter }}
    needs: shared
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        starter: [dashboard-page, product-card, storefront-widget, events-only]
    defaults:
      run:
        working-directory: starters/${{ matrix.starter }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: starters/${{ matrix.starter }}/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      # Online first; without the API it falls back to the schema the tool bundles, with a warning.
      - name: plugin.json passes Orbit's checks
        run: npx orbit-plugin validate
      # AGENTS.md, CLAUDE.md and .mcp.json name commands and MCP tools; a name
      # that does not exist sends a coding agent the wrong way on its first
      # step. Checked against this starter's own copy of the tool.
      - name: Agent files
        run: node ../../scripts/check-agent-files.mjs --starter ${{ matrix.starter }}

  image:
    name: ${{ matrix.starter }} image
    needs: starter
    # GitHub's arm64 runner (free for public repositories): the image is built for linux/arm64,
    # the platform Orbit hosting runs, without emulation.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        starter: [dashboard-page, product-card, storefront-widget, events-only]
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t starter:${{ matrix.starter }} starters/${{ matrix.starter }}
      - name: Run it the way Orbit hosting does, and ask for /health
        run: |
          docker run -d --name starter --read-only --tmpfs /tmp --user 1000 \
            -e PORT=8080 -e DATABASE_URL=file:/tmp/check.db \
            -e TOKEN_ENCRYPTION_KEY="$(openssl rand -hex 32)" -e WEBHOOK_SECRET=x \
            -p 18080:8080 starter:${{ matrix.starter }}
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors localhost:18080/health
      - name: It stops cleanly on SIGTERM
        run: |
          docker stop --time 10 starter
          test "$(docker inspect -f '{{.State.ExitCode}}' starter)" = 0
      - name: The container's output
        if: failure()
        run: docker logs starter
